spring:
  application:
    name: fintrack-api
  datasource:
    url: jdbc:h2:file:${user.home}/AppData/Local/FinTrack/data/fintrack;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: false
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    test-connection: false

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: PT2H
  recovery:
    expiration: PT10M
    email-from: ${MAIL_FROM}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID}
      auth-token: ${TWILIO_AUTH_TOKEN}
      from-number: ${TWILIO_FROM_NUMBER}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

logging:
  level:
    org.springframework.security: INFO
