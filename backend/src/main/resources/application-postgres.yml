spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fintrack}
    username: ${DATABASE_USERNAME:fintrack}
    password: ${DATABASE_PASSWORD:fintrack}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
